<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Bekar Naki? 🧲</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <a href="index.html" class="logo">Bekar <span>Naki?</span> 🧲</a>
    <div class="nav-links">
      <a href="index.html">← Back to Home</a>
    </div>
  </header>

  <div class="container">
    <div class="card" style="max-width: 440px; margin: 4rem auto;">
      
      <div style="text-align:center; margin-bottom:1.8rem;">
        <h2 style="font-size:1.9rem; margin-bottom:0.4rem;">Welcome Back! 👋</h2>
        <p style="color:var(--text-muted); margin:0;">Login to continue your skill journey</p>
      </div>

      <form id="login-form">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="Enter your registered email" required />

        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Enter your password" required />

        <div style="text-align:right; margin-top:-0.6rem; margin-bottom:1.2rem;">
          <a href="forgot.html" style="font-size:0.85rem; color:#c084fc; text-decoration:none;">
            Forgot Password?
          </a>
        </div>

        <button type="submit" id="login-btn" class="btn" style="width:100%;">Login →</button>
      </form>

      <hr style="border:0; border-top:1px solid var(--border); margin:1.6rem 0;" />

      <div style="text-align:center; font-size:0.95rem; color:var(--text-muted);">
        Don't have an account? <br />
        <a href="signup.html" style="color:#38bdf8; font-weight:700; text-decoration:none; display:inline-block; margin-top:0.4rem;">
          Create New Account ✨
        </a>
      </div>

    </div>
  </div>

  <!-- Firebase Connection -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBR3_EeUc15xDI-2QUxym0wTMyco9hJfjA",
      authDomain: "bekar-naki.firebaseapp.com",
      projectId: "bekar-naki",
      storageBucket: "bekar-naki.firebasestorage.app",
      messagingSenderId: "720723215856",
      appId: "1:720723215856:web:7deb0f660050f140720935",
      measurementId: "G-1VVJZHJ9NM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.innerText = "Logging in...";
      btn.disabled = true;

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-pass').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        alert("❌ Login Failed: Invalid email or password!");
        btn.innerText = "Login →";
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
